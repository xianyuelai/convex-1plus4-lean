name = "dominantFiveBody"
version = "0.1.0"
defaultTargets = ["DominantFiveBody", "Audit"]

[leanOptions]
warningAsError = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "DominantFiveBody"

[[lean_lib]]
name = "Audit"

# Deliberately not in defaultTargets: ordinary development remains buildable,
# while the dedicated whole-paper target rejects an absent unconditional proof.
[[lean_lib]]
name = "PaperAcceptance"
